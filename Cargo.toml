[package]
name = "somme-cli"
version = "0.1.1"
edition = "2024"
description = "Reusable authenticated CLI core for Somme-derived applications"
license = "MIT"
readme = "README.md"
repository = "https://github.com/querygraph/somme"
keywords = ["cli", "api", "authentication", "rate-limit"]
categories = ["command-line-utilities"]

[[bin]]
name = "somme"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
